
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CineBook</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav class="navbar">
            <div class="logo">Cine<span>Book</span></div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#movies">Movies</a></li>
                <li><a href="bookings.html">My Bookings</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="details-section">

        <section class="booking-selection">

            <h1>Create Your Account</h1>
            <p>Join CineBook and book your favourite movies!</p>

            <form id="registerForm">

                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="phone">Mobile Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your 10-digit mobile number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    minlength="6"
                    required
                >

                <button type="submit" class="continue-btn">
                    Create Account
                </button>

                <p id="registerMessage"></p>

            </form>

            <p>
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </section>

    </main>

    <footer>
        <h2>CineBook</h2>
        <p>Your favourite movies, your favourite seats.</p>
        <p>© 2026 CineBook. All Rights Reserved.</p>
    </footer>

    <script src="js/register.js"></script>

</body>
</html>
